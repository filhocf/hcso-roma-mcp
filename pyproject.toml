[project]
name = "hcso-roma-mcp"
version = "0.1.0"
description = "MCP server for Huawei Cloud HCSO Roma Connect administration"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Claudio Ferreira Filho", email = "filhocf@gmail.com" }]
keywords = ["mcp", "huawei", "hcso", "roma", "api-gateway"]

dependencies = [
    "mcp>=1.0.0",
    "huaweicloudsdkcore==3.1.207",
    "huaweicloudsdkroma==3.1.191",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[project.scripts]
hcso-roma-mcp = "hcso_roma_mcp.server:main"

[project.urls]
Repository = "https://github.com/filhocf/hcso-roma-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcso_roma_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.coverage.run]
source = ["hcso_roma_mcp"]
omit = ["tests/*"]
